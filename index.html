<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HELPATT • Матрёшка RP</title><meta name="theme-color" content="#ff7b39"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x2=%271%27 y2=%271%27%3E%3Cstop stop-color=%27%23ff7b39%27/%3E%3Cstop offset=%271%27 stop-color=%27%23ff4fd8%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%230c1117%27/%3E%3Cpath d=%27M11 47V17l21 19 21-19v30H43V36L32 46 21 36v11z%27 fill=%27url(%23g)%27/%3E%3C/svg%3E">
<style>
:root{--bg:#0c1117;--card:#171f2a;--line:#293443;--text:#f4f7fb;--muted:#94abc4;--orange:#ff7b39;--blue:#42a5ff;--green:#35dc8a;--red:#ff626c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1000px;margin:auto;padding:28px 18px 70px}
.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;margin-bottom:20px}.eyebrow{color:var(--orange);font-weight:900;letter-spacing:.06em}.hero h1{font-size:34px;margin:8px 0}.muted{color:var(--muted)}
.topic{display:flex;align-items:center;gap:18px}.num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#111;font-weight:900;font-size:20px;flex:none}.grow{flex:1}.topic h3{margin:0 0 2px}.locked{opacity:.45}.actions{display:flex;gap:12px;flex-wrap:wrap}
button{border:1px solid #354456;background:#111820;color:white;border-radius:11px;padding:13px 22px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:var(--orange);color:#101010;border:0}.blue{color:var(--blue)}.rule{padding:13px 0;border-bottom:1px solid #222d39}.rule:last-child{border:0}.badge{display:inline-block;background:#202b38;color:var(--blue);font:700 12px monospace;padding:3px 7px;border-radius:6px;margin-right:8px}.punish{display:inline-block;background:#4a2013;color:#ffad88;font-weight:800;padding:4px 10px;border-radius:999px;margin:4px}
.cheat{background:#17140f;border-color:#5a3c0b}.cheat h2{color:#ffc43d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.mini{background:#121212;border:1px solid #4b3510;border-radius:12px;padding:15px}.mini b{display:block;color:#ffc43d;font-size:23px}
.q{margin-bottom:16px}.q h3{font-size:18px}.option{display:block;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;cursor:pointer}.option:hover{border-color:#4c6075}.option input{margin-right:12px;accent-color:var(--orange)}.feedback{padding:12px;border-radius:9px;margin-top:10px}.ok{background:#0d3320;color:#45ef92}.bad{background:#3a1518;color:#ff7c84}.hidden{display:none!important}.progress{display:flex;gap:6px;margin:18px 0}.dot{height:10px;flex:1;max-width:28px;border-radius:10px;background:#26313e}.dot.done{background:var(--green)}.dot.now{background:var(--orange)}
@media(max-width:650px){.wrap{padding:14px 12px 50px}.hero,.card{padding:18px;border-radius:15px}.hero h1{font-size:26px}.topic{align-items:flex-start}.grid{grid-template-columns:1fr 1fr}.actions button{width:100%}.rule{font-size:15px}}
.logoMark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--orange),#ff4fd8);color:#0c1117;font-weight:1000;font-size:25px;box-shadow:0 0 28px color-mix(in srgb,var(--orange) 35%,transparent)}.brandWrap{display:flex;align-items:center;gap:10px;margin-right:auto}.brandText{font-size:19px;font-weight:1000;letter-spacing:.06em}.brandText small{display:block;font-size:9px;letter-spacing:.32em;color:var(--muted)}.topbar{position:sticky;top:0;z-index:20;background:#0c1117ee;border-bottom:1px solid var(--line)}.topbarin{max-width:1000px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.brand{font-weight:900;margin-right:auto}.settings{display:flex;align-items:center;gap:8px}.settings input{width:40px;height:38px;border:0;background:transparent}.search{width:100%;margin:14px 0;padding:13px;border-radius:12px;border:1px solid var(--line);background:#101720;color:var(--text)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stat{padding:16px;border:1px solid var(--line);border-radius:14px;background:#111820}.stat b{display:block;font-size:24px;color:var(--orange)}.fav{float:right;padding:2px 7px;border:0;background:transparent;font-size:18px}.fav.on{color:#ffd54a}@media(max-width:650px){.brand{width:100%}.stats{grid-template-columns:1fr}.topbarin button{flex:1}}.modegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.modecard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;transition:.18s}.modecard:hover{transform:translateY(-2px);border-color:var(--orange)}.modeicon{font-size:28px}.bar{height:10px;background:#26313e;border-radius:20px;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:var(--orange);border-radius:20px}.sectionTitle{margin:28px 0 12px}@media(max-width:750px){.modegrid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.modegrid{grid-template-columns:1fr}}</style>
<script src="rules-data.js"></script></head>
<body><header class="topbar"><div class="topbarin"><div class="brandWrap"><div class="logoMark">M</div><div class="brandText">HELPATT<small>MATRESHKA RP</small></div></div><button onclick="renderHome();show('home')">Главная</button><button onclick="openLibrary(false)">Все правила</button><button onclick="openTests()">Тесты</button><button onclick="startPunishmentDrill()">Наказания</button><button onclick="startRuleNumberDrill()">Угадай пункт</button><button onclick="startMistakeTest()">Повтор ошибок</button><button onclick="startQuickTest()">Быстрый тест</button><button onclick="openDashboard()">Мой прогресс</button><button onclick="startExam()">Экзамен</button><button onclick="openCheats()">Шпаргалки</button><button onclick="openMistakes()">Ошибки</button><button onclick="openStats()">Статистика</button><button onclick="openLibrary(true)">Избранное</button><div class="settings"><span class="muted">Цвет</span><input id="accentPicker" type="color" value="#ff7b39"><button onclick="randomAccent()">🎲</button></div></div></header><main class="wrap">
<section id="home">
 <div class="hero"><div style="display:flex;align-items:center;gap:16px;margin-bottom:14px"><div class="logoMark" style="width:58px;height:58px;font-size:34px">M</div><div><div class="eyebrow">HELPATT • MATRESHKA RP</div><div class="muted">База знаний администратора</div></div></div><h1>Подготовка к аттестации администратора</h1><div class="muted">Теория → тест из 15 вопросов → разбор ошибок. Следующая тема открывается после результата от 80%. Прогресс автоматически сохраняется в этом браузере.</div></div>
 <div class="stats"><div class="stat"><b id="statRules">0</b><span class="muted">правил</span></div><div class="stat"><b id="statQuestions">0</b><span class="muted">вопросов</span></div><div class="stat"><b id="statProgress">0%</b><span class="muted">прогресс</span></div></div><div id="topics"></div>
 <div class="actions"><button class="primary" onclick="continueStudy()">Продолжить обучение</button><button class="blue" onclick="resetProgress()">Сбросить прогресс</button></div>
</section>
<section id="theory" class="hidden"></section>
<section id="test" class="hidden"></section><section id="library" class="hidden"></section><section id="extra" class="hidden"></section>
</main>
<script>
const topics=(window.MRP_TOPICS||[]).map(t=>({title:t.title,desc:t.subtitle,rules:(t.rules||[]).map(r=>[r[0],r[1]+(r[2]&&r[2]!=="—"?" — "+r[2]:""),r[3]]),cheat:t.facts||[]}));
const questions=(window.MRP_TOPICS?.[0]?.questions||[]).map(x=>({q:x[0],a:x[1],c:x[2],e:x[3]}));
let progress=JSON.parse(localStorage.getItem("mrp-progress")||'{"unlocked":1,"last":0}');
function save(){localStorage.setItem("mrp-progress",JSON.stringify(progress))}
function show(id){["home","theory","test","library","extra"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));scrollTo(0,0)}
function renderHome(){document.getElementById("statRules").textContent=(window.MRP_TOPICS||[]).reduce((n,t)=>n+(t.rules||[]).length,0);document.getElementById("statQuestions").textContent=(window.MRP_TOPICS||[]).reduce((n,t)=>n+(t.questions||[]).length,0);document.getElementById("statProgress").textContent=Math.round(progress.unlocked/Math.max(1,topics.length)*100)+"%";const box=document.getElementById("topics");box.innerHTML=topics.map((t,i)=>`<div class="card topic ${i>=progress.unlocked?'locked':''}"><div class="num">${i<progress.unlocked?i+1:"🔒"}</div><div class="grow"><h3>${t.title}</h3><div class="muted">${t.desc}</div></div>${i<progress.unlocked?'<button onclick="openTheory('+i+')">Продолжить</button>':'<span class="muted">Заблокировано</span>'}</div>`).join("")}
function openTheory(i){progress.last=i;save();const t=topics[i];let sectionNames={"1":"Общие положения","2":"Игровой никнейм","3":"Аккаунт, имущество и стороннее ПО","4":"Игровой процесс и ПДД","5":"Правила чатов","6":"Взаимодействие с администрацией","7":"Правила репорта","8":"Voice Chat"};let grouped={};t.rules.forEach(r=>{let n=(r[0]||"0").split(".")[0];(grouped[n]??=[]).push(r)});let rules=t.rules.length?Object.keys(grouped).map(n=>'<div class="card" style="margin:14px 0"><div class="eyebrow">РАЗДЕЛ '+n+'</div><h2>'+n+'. '+(sectionNames[n]||"Правила")+'</h2>'+grouped[n].map(r=>'<div class="rule"><span class="badge">'+r[0]+'</span>'+r[1]+' '+(r[2]&&r[2]!=="—"?'<span class="punish">→ '+r[2]+'</span>':'')+'</div>').join("")+'</div>').join(""):'<p class="muted">Раздел подготовлен под наполнение актуальными правилами проекта.</p>';let cheat=t.cheat.length?`<div class="card cheat"><h2>⚡ Шпаргалка: цифры этой темы</h2><div class="grid">${t.cheat.map(x=>`<div class="mini"><b>${x[0]}</b><span class="muted">${x[1]}</span></div>`).join("")}</div></div>`:'';document.getElementById("theory").innerHTML=`<div class="hero"><div class="eyebrow">ТЕОРИЯ</div><h1>${t.title}</h1></div><div><h2>Правила по разделам</h2>${rules}</div>${cheat}<div class="actions"><button onclick="show('home')">← К списку тем</button><button class="primary" onclick="startTest(${i})">Пройти тест по теме →</button></div>`;show("theory")}
function startTest(i){let bank=(window.MRP_TOPICS?.[i]?.questions||[]).map(x=>({q:x[0],a:x[1],c:x[2],e:x[3]}));if(!bank.length){alert("База вопросов для этой темы ещё наполняется.");return}let qs=[...bank].sort(()=>Math.random()-.5).slice(0,15);document.getElementById("test").innerHTML=`<div class="hero"><div class="eyebrow">ТЕСТ • ${topics[i].title}</div><h1>Проверка знаний</h1><div class="muted">Ответь на 15 случайных вопросов. Для зачёта нужно не менее 80%.</div></div><div class="progress">${qs.map((_,j)=>'<i class="dot" id="d'+j+'"></i>').join("")}</div><form id="quiz">${qs.map((x,n)=>`<div class="card q"><div class="blue"><b>Вопрос ${n+1} из ${qs.length}</b></div><h3>${x.q}</h3>${x.a.map((a,j)=>`<label class="option"><input type="radio" name="q${n}" value="${j}"> ${a}</label>`).join("")}<div id="f${n}"></div></div>`).join("")}<div class="actions"><button type="button" onclick="show('home')">← Назад</button><button type="button" class="primary" id="check">Проверить ответы</button></div></form>`;document.getElementById("check").onclick=()=>grade(qs,i);show("test")}
function grade(qs,i){let score=0;qs.forEach((x,n)=>{let el=document.querySelector('input[name=q'+n+']:checked'),v=el?+el.value:-1,ok=v===x.c;if(ok)score++;else{if(!mistakes.some(m=>m.q===x.q))mistakes.push(x);localStorage.setItem("mrp-mistakes",JSON.stringify(mistakes))}document.getElementById("d"+n).classList.add(ok?"done":"now");document.getElementById("f"+n).innerHTML=`<div class="feedback ${ok?'ok':'bad'}">${ok?'✓ Верно.':'✕ Неверно.'} ${x.e}</div>`});let pct=Math.round(score/qs.length*100);history.unshift({date:new Date().toLocaleString("ru-RU"),score:score,total:qs.length,pct:pct,topic:topics[i]?.title||"Экзамен"});history=history.slice(0,30);localStorage.setItem("mrp-history",JSON.stringify(history));if(pct>=80){progress.unlocked=Math.max(progress.unlocked,i+2);save()}document.getElementById("check").outerHTML=`<button type="button" class="primary" onclick="renderHome();show('home')">Результат: ${score}/${qs.length} (${pct}%) • ${pct>=80?'Сдано ✓':'Повторить'}</button>`}

let favorites=JSON.parse(localStorage.getItem("mrp-favorites")||"[]");
function favKey(r){return r[0]+"|"+r[1]}
function toggleFav(encoded){let k=decodeURIComponent(encoded);favorites.includes(k)?favorites=favorites.filter(x=>x!==k):favorites.push(k);localStorage.setItem("mrp-favorites",JSON.stringify(favorites));openLibrary(window.libFav)}
function openLibrary(onlyFav){window.libFav=onlyFav;let all=(window.MRP_TOPICS||[]).flatMap(t=>(t.rules||[]).map(r=>({r:r,t:t.title})));if(onlyFav)all=all.filter(x=>favorites.includes(favKey(x.r)));let rows=all.map(x=>{let r=x.r,k=encodeURIComponent(favKey(r));return '<div class="rule libRule" data-text="'+(r.join(" ")+" "+x.t).toLowerCase().replace(/"/g,"&quot;")+'"><button class="fav '+(favorites.includes(favKey(r))?"on":"")+'" onclick="toggleFav(\''+k+'\')">★</button><span class="badge">'+r[0]+'</span>'+r[1]+' '+(r[2]&&r[2]!=="—"?'<span class="punish">'+r[2]+'</span>':'')+'</div>'}).join("");document.getElementById("library").innerHTML='<div class="hero"><div class="eyebrow">'+(onlyFav?"ИЗБРАННОЕ":"БАЗА ПРАВИЛ")+'</div><h1>'+(onlyFav?"Сохранённые правила":"Все правила")+'</h1><div class="muted">Ищи по номеру пункта, названию нарушения, тексту или наказанию.</div><input id="ruleSearch" class="search" placeholder="Поиск: DM, 4.25, 90 минут..."></div><div class="card" id="ruleList">'+(rows||'<p class="muted">Пока ничего не добавлено в избранное.</p>')+'</div>';let inp=document.getElementById("ruleSearch");inp.oninput=function(){let q=this.value.toLowerCase();document.querySelectorAll(".libRule").forEach(el=>el.style.display=el.dataset.text.includes(q)?"":"none")};show("library")}
const picker=document.getElementById("accentPicker");
function setAccent(c){document.documentElement.style.setProperty("--orange",c);picker.value=c;localStorage.setItem("mrp-accent",c);document.querySelector('meta[name="theme-color"]')?.setAttribute("content",c)}
picker.oninput=e=>setAccent(e.target.value);setAccent(localStorage.getItem("mrp-accent")||"#ff7b39");
function randomAccent(){setAccent("#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,"0"))}


function extraPage(title,sub,html){document.getElementById("extra").innerHTML='<div class="hero"><div class="eyebrow">HELPATT</div><h1>'+title+'</h1><div class="muted">'+sub+'</div></div>'+html;show("extra")}

function renderCustomQuiz(qs,title,sub){if(!qs.length){alert("Для этого режима пока недостаточно данных.");return}document.getElementById("test").innerHTML='<div class="hero"><div class="eyebrow">ТРЕНИРОВКА</div><h1>'+title+'</h1><div class="muted">'+sub+'</div></div><div class="progress">'+qs.map((_,j)=>'<i class="dot" id="d'+j+'"></i>').join("")+'</div><form id="quiz">'+qs.map((x,n)=>'<div class="card q"><div class="blue"><b>Вопрос '+(n+1)+' из '+qs.length+'</b></div><h3>'+x.q+'</h3>'+x.a.map((a,j)=>'<label class="option"><input type="radio" name="q'+n+'" value="'+j+'"> '+a+'</label>').join("")+'<div id="f'+n+'"></div></div>').join("")+'<div class="actions"><button type="button" onclick="renderHome();show(\'home\')">← Назад</button><button type="button" class="primary" id="check">Проверить</button></div></form>';document.getElementById("check").onclick=()=>grade(qs,0);show("test")}
function allOfficialRules(){return (window.MRP_TOPICS||[]).flatMap(t=>(t.rules||[])).filter(r=>r[0]&&r[1])}
function startPunishmentDrill(){let rr=allOfficialRules().filter(r=>r[3]&&r[3]!=="—");let pool=[...new Set(rr.map(r=>r[3]))];let qs=rr.sort(()=>Math.random()-.5).slice(0,15).map(r=>{let wrong=pool.filter(x=>x!==r[3]).sort(()=>Math.random()-.5).slice(0,3),a=[r[3],...wrong].sort(()=>Math.random()-.5);return{q:"Какое наказание предусмотрено за: "+r[1],a:a,c:a.indexOf(r[3]),e:"Пункт "+r[0]+": "+r[3]}});renderCustomQuiz(qs,"Только наказания","15 случайных ситуаций. Выбери правильную санкцию.")} 
function startRuleNumberDrill(){let rr=allOfficialRules(),nums=rr.map(r=>r[0]);let qs=rr.sort(()=>Math.random()-.5).slice(0,15).map(r=>{let wrong=nums.filter(x=>x!==r[0]).sort(()=>Math.random()-.5).slice(0,3),a=[r[0],...wrong].sort(()=>Math.random()-.5);return{q:r[1],a:a,c:a.indexOf(r[0]),e:"Правильный пункт: "+r[0]}});renderCustomQuiz(qs,"Угадай пункт правила","По описанию выбери правильный номер пункта.")}


function allQuestions(){return (window.MRP_TOPICS||[]).flatMap(t=>(t.questions||[]).map(x=>({q:x[0],a:x[1],c:x[2],e:x[3]})))}
function startQuickTest(){let qs=allQuestions().sort(()=>Math.random()-.5).slice(0,Math.min(5,allQuestions().length));renderCustomQuiz(qs,"Быстрый тест","5 случайных вопросов для быстрой проверки знаний.")}
function startMistakeTest(){if(!mistakes.length){alert("У тебя пока нет сохранённых ошибок.");return}let qs=[...mistakes].sort(()=>Math.random()-.5).slice(0,15);renderCustomQuiz(qs,"Повтор ошибок","Повтори вопросы, на которых раньше ошибался.")}
function clearMistakes(){if(confirm("Очистить список ошибок?")){mistakes=[];localStorage.setItem("mrp-mistakes","[]");openMistakes()}}


function openDashboard(){let best=history.length?Math.max(...history.map(x=>x.pct)):0,avg=history.length?Math.round(history.reduce((a,b)=>a+b.pct,0)/history.length):0,ruleCount=allOfficialRules().length;let modes=[["⚡","Быстрый тест","5 случайных вопросов","startQuickTest()"],["📝","Тесты по темам","Отдельная тренировка разделов","openTests()"],["🎓","Итоговый экзамен","До 30 вопросов из всей базы","startExam()"],["⚖️","Только наказания","Запомнить санкции","startPunishmentDrill()"],["🔢","Угадай пункт","Тренировка нумерации","startRuleNumberDrill()"],["❌","Работа над ошибками",mistakes.length+" сохранённых ошибок","startMistakeTest()"],["⭐","Избранное",favorites.length+" сохранённых правил","openLibrary(true)"],["📚","База правил",ruleCount+" правил в HELPATT","openLibrary(false)"]];let cards=modes.map(m=>'<div class="modecard" onclick="'+m[3]+'"><div class="modeicon">'+m[0]+'</div><h3>'+m[1]+'</h3><div class="muted">'+m[2]+'</div></div>').join("");let done=Math.min(100,Math.round(progress.unlocked/Math.max(1,topics.length)*100));extraPage("Мой прогресс","Центр подготовки HELPATT.",'<div class="stats"><div class="stat"><b>'+best+'%</b><span>лучший результат</span></div><div class="stat"><b>'+avg+'%</b><span>средний результат</span></div><div class="stat"><b>'+mistakes.length+'</b><span>ошибок на повторении</span></div></div><div class="card"><h3>Прогресс обучения — '+done+'%</h3><div class="bar"><i style="width:'+done+'%"></i></div></div><h2 class="sectionTitle">Режимы подготовки</h2><div class="modegrid">'+cards+'</div>')}

function openTests(){let cards=topics.map((t,i)=>'<div class="card topic"><div class="num">'+(i+1)+'</div><div class="grow"><h3>'+t.title+'</h3><div class="muted">'+((window.MRP_TOPICS[i].questions||[]).length)+' вопросов в банке</div></div><button onclick="startTest('+i+')">Начать</button></div>').join("");extraPage("Тесты по темам","Тренируй каждый раздел отдельно.",cards)}
function startExam(){let bank=(window.MRP_TOPICS||[]).flatMap(t=>(t.questions||[]).map(x=>({q:x[0],a:x[1],c:x[2],e:x[3]})));if(!bank.length)return;let qs=[...bank].sort(()=>Math.random()-.5).slice(0,Math.min(30,bank.length));document.getElementById("test").innerHTML='<div class="hero"><div class="eyebrow">ИТОГОВЫЙ ЭКЗАМЕН</div><h1>Случайная проверка знаний</h1><div class="muted">'+qs.length+' вопросов из всей базы. Проходной результат — 80%.</div></div><div class="progress">'+qs.map((_,j)=>'<i class="dot" id="d'+j+'"></i>').join("")+'</div><form id="quiz">'+qs.map((x,n)=>'<div class="card q"><div class="blue"><b>Вопрос '+(n+1)+' из '+qs.length+'</b></div><h3>'+x.q+'</h3>'+x.a.map((a,j)=>'<label class="option"><input type="radio" name="q'+n+'" value="'+j+'"> '+a+'</label>').join("")+'<div id="f'+n+'"></div></div>').join("")+'<div class="actions"><button type="button" onclick="renderHome();show(\'home\')">← Назад</button><button type="button" class="primary" id="check">Проверить экзамен</button></div></form>';document.getElementById("check").onclick=()=>grade(qs,0);show("test")}
function openCheats(){let all=(window.MRP_TOPICS||[]).flatMap(t=>(t.facts||[]).map(x=>({x,t:t.title})));extraPage("Шпаргалки","Главные цифры и значения из правил.",'<div class="grid">'+all.map(o=>'<div class="mini"><b>'+o.x[0]+'</b><span>'+o.x[1]+'</span><small class="muted" style="display:block;margin-top:8px">'+o.t+'</small></div>').join("")+'</div>')}
function openMistakes(){let h=mistakes.length?mistakes.map((m,i)=>'<div class="card"><div class="blue">Ошибка '+(i+1)+'</div><h3>'+m.q+'</h3><div class="muted">'+m.e+'</div></div>').join(""):'<div class="card"><h3>Ошибок пока нет 🎉</h3><div class="muted">Ошибочные ответы из тестов будут автоматически появляться здесь.</div></div>';extraPage("Работа над ошибками","HELPATT запоминает вопросы, в которых ты ошибся.",'<div class="actions" style="margin-bottom:16px"><button class="primary" onclick="startMistakeTest()">Тренировать ошибки</button><button onclick="clearMistakes()">Очистить ошибки</button></div>'+h)}
function openStats(){let best=history.length?Math.max(...history.map(x=>x.pct)):0,avg=history.length?Math.round(history.reduce((a,b)=>a+b.pct,0)/history.length):0;let rows=history.length?history.map(x=>'<div class="rule"><b>'+x.pct+'%</b> — '+x.topic+' <span class="muted">• '+x.date+'</span></div>').join(""):'<p class="muted">Пройди первый тест — здесь появится история.</p>';extraPage("Статистика","История результатов хранится прямо в браузере.",'<div class="stats"><div class="stat"><b>'+history.length+'</b><span>попыток</span></div><div class="stat"><b>'+best+'%</b><span>лучший результат</span></div><div class="stat"><b>'+avg+'%</b><span>средний результат</span></div></div><div class="card"><h2>Последние попытки</h2>'+rows+'</div>')}

function continueStudy(){openTheory(Math.min(progress.last,progress.unlocked-1))}
function resetProgress(){if(confirm("Сбросить весь сохранённый прогресс?")){progress={unlocked:1,last:0};save();renderHome()}}
renderHome();
</script></body></html>
